<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dr Otgen Clinic A.Ş. kişisel verilerin korunması ve KVKK aydınlatma metni." />
    <title>Gizlilik ve KVKK | Dr Otgen Clinic</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const locale = location.pathname.match(/^\/(tr|en|ar|es|fr|it|ru|de)(?:\/|$)/)?.[1] || 'tr';
        document.documentElement.lang = locale;
        document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: Inter, sans-serif;
        background: #0f1419;
        color: #e8e4dc;
        line-height: 1.7;
      }
      .container { max-width: 860px; margin: 0 auto; padding: 48px 20px 72px; }
      h1, h2, h3 { font-family: 'Playfair Display', serif; color: #f5f0e6; line-height: 1.35; }
      h1 { font-size: 1.75rem; margin-bottom: 1.25rem; }
      h2 { font-size: 1.25rem; margin-top: 2rem; }
      h3 { font-size: 1.05rem; margin-top: 1rem; }
      p, li { color: #d5d0c8; }
      a { color: #c9a84c; }
      ul { padding-left: 1.25rem; }
      .privacy-section { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid rgba(201, 168, 76, 0.25); }
      .privacy-branch { margin-bottom: 1rem; }
      .privacy-signature { margin-top: 2rem; font-weight: 600; }
      .privacy-back { margin-top: 2rem; }
    </style>
  </head>
  <body>
    <div class="container">
      <main id="privacy-app"></main>
    </div>
    <script type="module" src="/src/privacy.js"></script>
  </body>
</html>
